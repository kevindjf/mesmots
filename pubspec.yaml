name: mesmots
description: Application ludique pour apprendre les mots de dictée de la semaine (enfants de 5 à 10 ans)
publish_to: 'none'
version: 1.2.1+6

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Audio & TTS
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0

  # UI & Animations
  lottie: ^3.0.0
  flutter_animate: ^4.5.0

  # Utils
  characters: ^1.3.0
  crypto: ^3.0.3
  uuid: ^4.3.3
  collection: ^1.18.0

  # Image & Camera

  # Icons
  phosphor_flutter: ^2.1.0
  flutter_svg: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/sounds/
    - assets/animations/
    - assets/icons/

  # Fonts
  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka-Bold.ttf
          weight: 700

# App icon (regenerate with: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

# Native splash, white like the app (regenerate with:
# dart run flutter_native_splash:create). On Android 12+ the icon is the
# animated android/app/src/main/res/drawable/splash_animated.xml: after
# create, put it back in res/values-v31 and res/values-night-v31.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/splash.png
  android_12:
    color: "#FFFFFF"
    image: assets/splash/splash_android12.png
  android: true
  ios: true
  web: false
