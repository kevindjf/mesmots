name: mesmots
description: Application mobile d'apprentissage ludique des mots de dictée pour enfants de 5 à 10 ans
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2

  # Audio & TTS
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0

  # UI & Animations
  lottie: ^3.1.0
  flutter_animate: ^4.5.0

  # Utils
  crypto: ^3.0.3
  uuid: ^4.3.3
  collection: ^1.18.0

  # Icons
  phosphor_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/sounds/
    - assets/animations/
    - assets/icons/

  # Fonts
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
